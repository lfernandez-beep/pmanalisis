name: Update semanal de datos

on:
  schedule:
    # Todos los sábados a las 09:00 UTC (mercado ya cerrado desde el viernes,
    # datos del viernes ya consolidados). Ajustar horario si lo preferís.
    - cron: "0 9 * * 6"
  workflow_dispatch:  # también se puede disparar a mano cuando quieras

permissions:
  contents: write  # necesario para que el job pueda hacer git push de vuelta al repo

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Update incremental de precios
        run: python pipeline/update.py

      - name: Recalcular métricas
        run: python pipeline/metrics.py

      - name: Copiar metricas.json a la carpeta pública del dashboard
        run: |
          mkdir -p dashboard/data
          cp data/processed/metricas.json dashboard/data/metricas.json

      - name: Copiar datos que necesita la función de análisis (api/analyze.py, en Vercel)
        run: |
          mkdir -p api/data
          cp data/processed/precios_ajustados.parquet api/data/
          cp data/processed/metricas.json api/data/

      - name: Commitear datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/ dashboard/data/ api/data/
          git diff --staged --quiet || git commit -m "Update semanal automático $(date +%Y-%m-%d)"
          git push
