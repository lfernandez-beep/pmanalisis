name: Backfill inicial (manual, una sola vez)

on:
  workflow_dispatch:  # se dispara a mano desde la pestaña "Actions" de GitHub

permissions:
  contents: write  # necesario para que el job pueda hacer git push de vuelta al repo

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # ya no hace falta el margen de 5hs: no se vuelve a descargar todo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Filtrar universo por liquidez (usa datos ya descargados, sin red)
        run: python pipeline/refilter_universe.py

      - name: Recalcular métricas sobre el universo filtrado
        run: python pipeline/metrics.py

      - name: Commitear datos al repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/
          git diff --staged --quiet || git commit -m "Universo filtrado por liquidez + métricas recalculadas"
          git push
