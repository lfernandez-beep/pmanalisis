[build]
  publish = "dashboard"
  functions = "netlify/functions"

[functions]
  # NOTA: verificar en la documentación oficial de Netlify si "python3.11" (o
  # la versión que corresponda) sigue siendo un runtime soportado para
  # Functions al momento de desplegar esto. El soporte de Python en Netlify
  # Functions ha sido más limitado que Node.js -- si no está disponible,
  # esta lógica (portfolio_logic.py) se puede envolver en un runtime distinto
  # (ej. Netlify Functions con Node + subprocess a Python, o migrar a un
  # servicio como Render/Railway que sí soporta Python nativamente sin dudas).
  python_version = "3.11"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
